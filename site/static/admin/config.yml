backend:
  # TODO: git-gateway requires Netlify Identity for login, which conflicts with
  # keeping this off Netlify/big tech. Once hosting for the subdomain is
  # finalized, replace this with a self-hosted or GitHub-OAuth backend and
  # update `branch` to match wherever the live site actually deploys from.
  name: git-gateway
  branch: main

media_folder: "site/static/img" # Folder where uploaded images go
public_folder: "img"

collections:
  - name: "blog"
    label: "Blog"
    label_singular: "Post"
    folder: "site/content/blog"
    path: "{{slug}}/index"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Summary", name: "description", widget: "text", hint: "Shown on the blog list page."}
      - {label: "Author", name: "author", widget: "string", required: false, hint: "Leave blank to publish unsigned."}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
