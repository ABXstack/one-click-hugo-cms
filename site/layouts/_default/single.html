{{ define "main" }}

{{ partial "page-head" . }}

{{ with .Content }}
	<div class="page-intro">
		<div class="wrap">
			<div class="prose">{{ . }}</div>
		</div>
	</div>
{{ end }}

{{ if .Params.resources }}
	{{ partial "resources" . }}
{{ else }}
	<div style="padding-bottom:4rem"></div>
{{ end }}

{{ end }}
